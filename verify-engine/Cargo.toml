[package]
name = "game-recomp-verify"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Advanced pure-Rust differential verification engine for GameReComp"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive", "color", "wrap_help"] }

[profile.release]
opt-level = 2
lto = "thin"
