name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            binary: gamerecomp
            archive: GameReComp-${{ github.ref_name }}-linux-x86_64.tar.gz
          - name: macos-arm64
            runner: macos-14
            binary: gamerecomp
            archive: GameReComp-${{ github.ref_name }}-macos-arm64.tar.gz
          - name: windows-x86_64
            runner: windows-latest
            binary: gamerecomp.exe
            archive: GameReComp-${{ github.ref_name }}-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Verify version
        shell: bash
        run: ./target/release/${{ matrix.binary }} --version
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="GameReComp-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$staging"
          cp "target/release/${{ matrix.binary }}" "$staging/GameReComp"
          cp README.md CHANGELOG.md LICENSE "$staging/"
          tar -czf "${{ matrix.archive }}" "$staging"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          staging="GameReComp-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$staging"
          cp "target/release/${{ matrix.binary }}" "$staging/GameReComp.exe"
          cp README.md CHANGELOG.md LICENSE "$staging/"
          7z a "${{ matrix.archive }}" "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: dist/*
