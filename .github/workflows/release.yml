name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload assets to (e.g. v0.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: cli-linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: game-recomp-cli
            features: cli
            archive: GameReComp-cli-${{ inputs.tag || github.ref_name }}-linux-x86_64.tar.gz
          - artifact: gui-linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: game-recomp-gui
            features: gui
            archive: GameReComp-gui-${{ inputs.tag || github.ref_name }}-linux-x86_64.tar.gz
          # macos-14 was retired; those jobs were cancelled 1s after start
          # with zero steps in run 45361864557. Use the maintained ARM64 label.
          - artifact: cli-macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bin: game-recomp-cli
            features: cli
            archive: GameReComp-cli-${{ inputs.tag || github.ref_name }}-macos-arm64.tar.gz
          - artifact: gui-macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bin: game-recomp-gui
            features: gui
            archive: GameReComp-gui-${{ inputs.tag || github.ref_name }}-macos-arm64.tar.gz
          - artifact: cli-windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin: game-recomp-cli
            features: cli
            archive: GameReComp-cli-${{ inputs.tag || github.ref_name }}-windows-x86_64.zip
          - artifact: gui-windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin: game-recomp-gui
            features: gui
            archive: GameReComp-gui-${{ inputs.tag || github.ref_name }}-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux' && matrix.features == 'gui'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype-dev libexpat1-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan1 libssl-dev pkg-config

      - name: Build ${{ matrix.bin }}
        shell: bash
        run: cargo build --release --bin ${{ matrix.bin }} --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

      - name: Verify binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="${bin}.exe"; fi
          ls -lh "$bin"
          "$bin" --version || true

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          staging="GameReComp-${{ matrix.artifact }}-${tag}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$staging/"
          cp README.md CHANGELOG.md LICENSE "$staging/"
          tar -czf "${{ matrix.archive }}" "$staging"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          staging="GameReComp-${{ matrix.artifact }}-${tag}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}.exe" "$staging/"
          cp README.md CHANGELOG.md LICENSE "$staging/"
          7z a "${{ matrix.archive }}" "$staging"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: false
          prerelease: true
          files: dist/*
