[package]
name = "game-recomp"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "GameReComp Rust CLI (game-recomp-cli) and GPUI desktop GUI (game-recomp-gui) with WASM-ready core"

[lib]
name = "game_recomp"
path = "src/lib.rs"

[[bin]]
name = "game-recomp-cli"
path = "src/bin/game-recomp-cli.rs"
required-features = ["cli"]

[[bin]]
name = "game-recomp-verify"
path = "src/bin/game-recomp-verify.rs"
required-features = ["cli"]

[[bin]]
name = "game-recomp-gui"
path = "src/bin/game-recomp-gui.rs"
required-features = ["gui"]

[features]
default = ["cli", "gui"]
cli = [
    "dep:clap",
    "dep:chrono",
    "dep:indicatif",
    "dep:open",
    "dep:owo-colors",
]
gui = [
    "cli",
    "dep:gpui-kit",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

# CLI dependencies (excluded on wasm32-unknown-unknown --lib --no-default-features)
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
clap = { version = "4.6", features = ["derive", "color", "wrap_help"], optional = true }
indicatif = { version = "0.18", optional = true }
open = { version = "5", optional = true }
owo-colors = { version = "4", optional = true }

# GPUI Kit desktop GUI dependencies (https://github.com/longbridge/gpui-kit)
gpui-kit = { version = "0.10.0", optional = true }

[profile.release]
opt-level = 2
lto = "thin"
